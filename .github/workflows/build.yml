name: Build Installers

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    # windows-2022 自带 VS2022(v17)，node-gyp 可识别；windows-latest 已是 VS2025(v18)，老 node-gyp 不认会报“找不到 VS”
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 把 MSVC 开发环境注入 PATH，让 node-gyp 能找到 Visual Studio（编译 robotjs 必需）
      - uses: ilammy/msvc-dev-cmd@v1
      # windows runner 的 Python 3.12 同样缺 distutils，node-gyp 需要它
      - run: python -m pip install --upgrade "setuptools<81" wheel
      - run: echo "npm_config_python=$(which python)" >> "$GITHUB_ENV"
      # 键鼠捕获用 uiohook-napi（N-API + npm 包里自带预编译 .node，无需编译）；
      # 只有注入用的 robotjs 需要从源码编（它的 install.js 会去 GitHub 拉不存在的预编译包，故跳过）。
      - run: npm install --ignore-scripts
      - run: node node_modules/electron/install.js
      # 只编 robotjs：uiohook-napi 用包内 N-API 预编译，重编它既慢又可能失败；
      # 打包阶段 electron-builder 的自动 rebuild 也已关闭（npmRebuild: false）。
      - run: npx electron-rebuild --force --only robotjs
      - run: npm run dist:win
        env:
          # 无签名证书时关闭自动签名，避免 electron-builder 索取 GH_TOKEN
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: switchscreen-win
          path: dist/*.exe

  macos:
    # macOS 13 (Ventura) 既可能是 Intel 也可能是 Apple Silicon，两种架构都要出包；
    # 原生模块(i hook/robotjs)必须按目标架构分别编译，所以用矩阵而不是一次编两个 arch。
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # macOS 12+ 的 Python 3.12+ 移除了 distutils，node-gyp 需要它 -> 用 setuptools 补回（PEP668 需 --break-system-packages）
      - run: python3 -m pip install --break-system-packages --upgrade "setuptools<81" wheel
      - run: echo "npm_config_python=$(which python3)" >> "$GITHUB_ENV"
      - run: npm install --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npx electron-rebuild --force --arch ${{ matrix.arch }} --only robotjs
      # 内置 DDC 工具：Apple Silicon 用 m1ddc，Intel 用 ddcctl（交叉编译 x86_64）。
      # 失败不阻塞出包，运行时会回退到 PATH 里的同名工具并给出提示。
      - name: Build bundled DDC helper
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/tools"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            git clone --depth 1 https://github.com/waydabber/m1ddc.git /tmp/m1ddc
            make -C /tmp/m1ddc
            cp /tmp/m1ddc/m1ddc "$GITHUB_WORKSPACE/build/tools/m1ddc"
            chmod +x "$GITHUB_WORKSPACE/build/tools/m1ddc"
          else
            git clone --depth 1 https://github.com/kfix/ddcctl.git /tmp/ddcctl
            make -C /tmp/ddcctl CC="clang -arch x86_64"
            cp /tmp/ddcctl/bin/release/ddcctl "$GITHUB_WORKSPACE/build/tools/ddcctl"
            chmod +x "$GITHUB_WORKSPACE/build/tools/ddcctl"
          fi
          ls -l "$GITHUB_WORKSPACE/build/tools"
      # dmg 打包依赖 dmg-license（它声明了 os=darwin）：显式补装一次，
      # 免得依赖树解析把它漏掉导致 “Cannot find module 'dmg-license'” 又把构建打挂。
      # 失败不阻塞 —— 上面那次 npm install 通常已经把它装好了，这一步只是兜底
      - name: Ensure dmg-license
        continue-on-error: true
        run: npm install --no-save dmg-license@1.0.11
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish=never
        env:
          # 无签名证书时允许 electron-builder 产出未签名 dmg（用户需手动绕过 Gatekeeper）
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: switchscreen-mac-${{ matrix.arch }}
          path: dist/*.dmg
