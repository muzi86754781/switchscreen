<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #161b26;
    --text: #e6edf3;
    --sub: #8b949e;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  .prompt-box {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    padding: 12px 14px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.65);
    overflow: hidden;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: 13px;
    font-weight: 700;
    color: #93c5fd;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .from {
    font-size: 11px;
    background: rgba(59, 130, 246, 0.18);
    border: 1px solid rgba(59, 130, 246, 0.38);
    padding: 1px 7px;
    border-radius: 4px;
    color: #93c5fd;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-close-x {
    cursor: pointer;
    color: #8b949e;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.12s;
  }
  .btn-close-x:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
  }
  .content {
    margin: 5px 0;
  }
  .main-text {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.4;
  }
  .meta-text {
    font-size: 11.5px;
    color: var(--sub);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .badge-auto {
    font-size: 11px;
    color: #34d399;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btns {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .btn {
    appearance: none;
    border: none;
    outline: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-accept {
    background: var(--primary);
    color: #fff;
  }
  .btn-accept:hover { background: var(--primary-hover); }
  .btn-cancel {
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .btn-cancel:hover { background: rgba(255, 255, 255, 0.15); }
</style>
</head>
<body>
  <div class="prompt-box">
    <div class="head">
      <div class="title" id="tTitle">⚡ 收到消息</div>
      <div class="head-right">
        <div class="from" id="tFrom">来自 设备</div>
        <span class="btn-close-x" id="btnCloseX" title="关闭">✕</span>
      </div>
    </div>
    <div class="content">
      <div class="main-text" id="tMain">文件名或文字预览</div>
      <div class="meta-text" id="tMeta">详细信息</div>
    </div>
    <div class="foot">
      <div id="tAutoBadge" style="display: none;">
        <span class="badge-auto">● 已自动接收</span>
      </div>
      <div class="btns" id="tBtns">
        <button type="button" class="btn btn-cancel" id="btnCancel">取消</button>
        <button type="button" class="btn btn-accept" id="btnAccept">接收</button>
      </div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    let currentId = '';

    ipcRenderer.on('show-prompt', (_e, data) => {
      currentId = data.id || '';
      document.getElementById('tTitle').textContent = data.title || '⚡ 收到消息';
      document.getElementById('tFrom').textContent = (data.from ? ('来自 ' + data.from) : '来自 局域网设备');
      document.getElementById('tMain').textContent = data.main || '';
      document.getElementById('tMeta').textContent = data.meta || '';

      const autoBadge = document.getElementById('tAutoBadge');
      const btnAccept = document.getElementById('btnAccept');
      const btnCancel = document.getElementById('btnCancel');

      if (data.needConfirm) {
        autoBadge.style.display = 'none';
        btnAccept.style.display = 'inline-block';
        btnAccept.textContent = data.acceptText || '接收';
        btnCancel.textContent = data.cancelText || '取消';
      } else {
        autoBadge.style.display = 'block';
        btnAccept.style.display = 'none';
        btnCancel.textContent = '关闭';
      }
    });

    document.getElementById('btnAccept').addEventListener('click', () => {
      ipcRenderer.send('prompt-response', { id: currentId, accept: true });
    });
    document.getElementById('btnCancel').addEventListener('click', () => {
      ipcRenderer.send('prompt-response', { id: currentId, accept: false });
    });
    document.getElementById('btnCloseX').addEventListener('click', () => {
      ipcRenderer.send('prompt-response', { id: currentId, accept: false });
    });
  </script>
</body>
</html>
